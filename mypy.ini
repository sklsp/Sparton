# Type checking for Sparton. `mypy` with no arguments must stay clean; CI runs it.
[mypy]
python_version = 3.12
files = app, workers, tests
# Packages without type information count as Any instead of failing the check.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Strict mode (every function annotated, no bare generics, no Any returns) so CI keeps the whole code base fully typed.
strict = true

[mypy-tests.*]
# Annotating every test function is not the goal; tests are checked for type errors but defs stay optional.
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_incomplete_defs = False

# not yet typed; each run removes some
[mypy-tests.test_agent_engine,tests.qa_shots,tests.test_billing_service]
ignore_errors = True
