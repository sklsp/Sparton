# Type checking for Sparton. `mypy` with no arguments must stay clean; CI runs it.
[mypy]
python_version = 3.12
files = app, workers
# Packages without type information count as Any instead of failing the check.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Strict mode (every function annotated, no bare generics, no Any returns) so CI keeps the whole code base fully typed.
strict = true
